<form action="/add-member" method="POST">

<input name="name" placeholder="Full Name"><br>

<input name="phone" placeholder="Phone Number"><br>

<input name="address" placeholder="Address"><br>

<input name="occupation" placeholder="Occupation"><br>

<input name="nin" placeholder="NIN Number"><br>

<button type="submit">Register Member</button>

</form>
<h3>Guarantor 1</h3>

<label>Name</label>
<input type="text" name="guarantor1_name" required>

<label>Phone</label>
<input type="text" name="guarantor1_phone" required>

<label>Address</label>
<input type="text" name="guarantor1_address" required>


<h3>Guarantor 2</h3>

<label>Name</label>
<input type="text" name="guarantor2_name" required>

<label>Phone</label>
<input type="text" name="guarantor2_phone" required>

<label>Address</label>
<input type="text" name="guarantor2_address" required>
<script>

document.querySelector("form").addEventListener("submit", function(e){

e.preventDefault()

let member = {
name: document.querySelector("[name=name]").value,
phone: document.querySelector("[name=phone]").value,
nin: document.querySelector("[name=nin]").value,
age: document.querySelector("[name=age]").value
}

let members = JSON.parse(localStorage.getItem("members")) || []

members.push(member)

localStorage.setItem("members", JSON.stringify(members))

alert("Member Registered Successfully")

window.location = "members.html"

})

</script>
