<html>
<head>
<a href="add-member
</head>

<body>

<h2>Register Member</h2>

<form>
<input type="text" name="name" placeholder="Full Name">
<input type="text" name="phone" placeholder="Phone Number">
<input type="text" name="nin" placeholder="NIN">
<input type="number" name="age" placeholder="Age">
<input type="file" name="passport">

<button type="submit">Register Member</button>
</form>

<script>
document.querySelector("form").addEventListener("submit", function(e){
  e.preventDefault();

  let members = JSON.parse(localStorage.getItem("members")) || [];

  // Auto ID
  let idNumber = (members.length + 1).toString().padStart(3,"0");
  let memberId = "IGB" + idNumber;

  let fileInput = document.querySelector('[name="passport"]');
  let reader = new FileReader();

  reader.onload = function(){
    let member = {
      id: memberId,
      name: document.querySelector('[name="name"]').value,
      phone: document.querySelector('[name="phone"]').value,
      nin: document.querySelector('[name="nin"]').value,
      age: document.querySelector('[name="age"]').value,
      passport: reader.result || ""
    };

    members.push(member);
    localStorage.setItem("members", JSON.stringify(members));

    alert("Member Registered Successfully!");
    window.location.href = "members.html";
  };

  if(fileInput.files[0]){
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    reader.onload();
  }
});
</script>

</body>
</html>
