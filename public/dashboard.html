<!DOCTYPE html>
<html>
<head>
<title>Weekly Contribution</title>

<style>

body{
font-family: Arial;
background:#f4f6f9;
}

.container{
width:500px;
margin:auto;
margin-top:60px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
color:green;
}

input,select{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:12px;
background:green;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

.fixed{
background:#eee;
}

</style>
<script>

let contributions = JSON.parse(localStorage.getItem("contributions")) || [];

let minutesTotal = 0;
let sharesTotal = 0;
let savingsTotal = 0;

contributions.forEach(c => {

minutesTotal += Number(c.minutes);

sharesTotal += Number(c.shares);

savingsTotal += Number(c.savings);

});

let totalCollection = minutesTotal + sharesTotal + savingsTotal;

document.getElementById("financialSummary").innerHTML =

"Minutes Collected: " + minutesTotal + "<br><br>" +

"Shares Collected: " + sharesTotal + "<br><br>" +

"Savings Collected: " + savingsTotal + "<br><br>" +

"Total Weekly Collection: " + totalCollection;

</script>
</head>

<body>

<div class="container">

<h2>Weekly Contribution</h2>

<form>

<label>Member ID</label>
<input type="text" placeholder="Enter Member ID">

<label>Week Number</label>
<select>
<option>Week 1</option>
<option>Week 2</option>
<option>Week 3</option>
<option>Week 4</option>
</select>

<label>Minutes Contribution</label>
<input type="number" id="minutes" placeholder="Enter minutes amount">

<label>Share Contribution</label>
<input type="number" id="shares" placeholder="Enter share amount">

<label>Savings Contribution</label>
<input type="number" id="savings" placeholder="Enter savings amount">

<button onclick="recordContribution()">Record Contribution</button>

</form>

</div>
<script><label>Minutes Contribution</label>
<input type="number" id="minutes" placeholder="Enter minutes amount">

<label>Share Contribution</label>
<input type="number" id="shares" placeholder="Enter share amount">

<label>Savings Contribution</label>
<input type="number" id="savings" placeholder="Enter savings amount">

function recordContribution(){

let memberId = document.querySelector('input[placeholder="Enter Member ID"]').value;

let week = document.querySelector('select').value;

let minutes = document.querySelector('input[value="200"]').value;

let shares = document.querySelector('input[value="500"]').value;

let savings = document.querySelector('input[value="1000"]').value;

let contributions = JSON.parse(localStorage.getItem("contributions")) || [];

let record = {

memberId: memberId,
week: week,
minutes: Number(minutes),
shares: Number(shares),
savings: Number(savings)

};

contributions.push(record);

localStorage.setItem("contributions", JSON.stringify(contributions));

alert("Contribution Recorded Successfully");

}

</script>
</body>
