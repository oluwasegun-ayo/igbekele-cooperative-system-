<!DOCTYPE html>
<html>

<head>
<title>Member Profile</title>
</head>

<body>

<h1>Member Profile</h1>

<div id="profile"></div>
<script>

let member = JSON.parse(localStorage.getItem("selectedMember"));

let contributions = JSON.parse(localStorage.getItem("contributions")) || [];

let minutes = 0;
let shares = 0;
let savings = 0;

contributions.forEach(c => {

if(c.memberId === member.id){

minutes += c.minutes;
shares += c.shares;
savings += c.savings;

}

});

document.getElementById("profile").innerHTML =

"<h2>" + member.name + "</h2>" +

"Minutes Paid: " + minutes + "<br><br>" +

"Shares: " + shares + "<br><br>" +

"Savings: " + savings;

</script>
