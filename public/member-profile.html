<!DOCTYPE html>
<html>

<head>
<title>Member Profile</title>
</head>

<body>

<h1>Member Profile</h1>

<div id="profile"></div>

<script>

let member = JSON.parse(localStorage.getItem("selectedMember"));

let profile = document.getElementById("profile");

profile.innerHTML = `

<img src="${member.passport || ''}" width="100"><br><br>

<b>Member ID:</b> ${member.id}<br><br>

<b>Name:</b> ${member.name}<br><br>

<b>Phone:</b> ${member.phone}<br><br>

<b>NIN:</b> ${member.nin}<br><br>

<b>Age:</b> ${member.age}<br><br>

<script>

let member = JSON.parse(localStorage.getItem("selectedMember"));
let contributions = JSON.parse(localStorage.getItem("contributions")) || [];

let minutes = 0;
let shares = 0;
let savings = 0;

contributions.forEach(c => {

if(c.memberId === member.id){

minutes += c.minutes;
shares += c.shares;
savings += c.savings;

}

});

document.getElementById("profile").innerHTML = `

<img src="${member.passport || ''}" width="100"><br><br>

<b>Member ID:</b> ${member.id}<br>
<b>Name:</b> ${member.name}<br>
<b>Phone:</b> ${member.phone}<br>
<b>NIN:</b> ${member.nin}<br>
<b>Age:</b> ${member.age}<br><br>

<h3>Financial Summary</h3>

Minutes Paid: ${minutes}<br>
Shares: ${shares}<br>
Savings: ${savings}<br>

`;

</script>

</body>

</html>
