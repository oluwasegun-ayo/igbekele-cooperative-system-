<!DOCTYPE html>
<html>

<head>
<title>Member Profile</title>
</head>

<body>

<h1>Member Profile</h1>

<div id="profile"></div>
<script>

let member = JSON.parse(localStorage.getItem("selectedMember"));

let contributions = JSON.parse(localStorage.getItem("contributions")) || [];

let minutesTotal = 0;
let sharesTotal = 0;
let savingsTotal = 0;

contributions.forEach(c => {

if(c.memberId === member.id){

minutesTotal += c.minutes;
sharesTotal += c.shares;
savingsTotal += c.savings;

}

});

document.getElementById("profile").innerHTML = `

<h2>${member.name}</h2>

Minutes Paid: ${minutesTotal}<br><br>

Shares: ${sharesTotal}<br><br>

Savings: ${savingsTotal}

`;

</script>
</body>

</html>
