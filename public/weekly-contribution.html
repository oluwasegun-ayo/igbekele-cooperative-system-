<!DOCTYPE html>
<html>

<head>
<title>Weekly Contribution</title>
</head>

<body>

<h1>Weekly Contribution</h1>

<table border="1" width="100%">

<thead>
<tr>
<th>Member</th>
<th>Minutes</th>
<th>Shares</th>
<th>Savings</th>
<th>Record</th>
</tr>
</thead>

<tbody id="memberTable"></tbody>

</table>

<script>

let members = JSON.parse(localStorage.getItem("members")) || [];

let contributions = JSON.parse(localStorage.getItem("contributions")) || [];

let table = document.getElementById("memberTable");

members.forEach((m,i)=>{

table.innerHTML += `
<tr>

<td>${m.name} (${m.id})</td>

<td><input type="number" id="minutes${i}" placeholder="200"></td>

<td><input type="number" id="shares${i}" placeholder="500"></td>

<td><input type="number" id="savings${i}" placeholder="500"></td>

<td>

<button onclick="recordContribution(${i})">Record</button>

</td>

</tr>
`;

});


function recordContribution(index){

let member = members[index];

let minutes = document.getElementById("minutes"+index).value;

let shares = document.getElementById("shares"+index).value;

let savings = document.getElementById("savings"+index).value;

let record = {

memberId: member.id,

minutes: Number(minutes),

shares: Number(shares),

savings: Number(savings)

};

contributions.push(record);

localStorage.setItem("contributions", JSON.stringify(contributions));

alert("Contribution recorded for " + member.name);

}

</script>

</body>

</html>
