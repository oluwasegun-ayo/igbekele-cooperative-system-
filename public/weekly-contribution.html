<h1>IGBEKELE OLUWA MULTI PURPOSE COOPERATIVE SOCIETY</h1>

<h2>Weekly Contribution</h2>

<form id="contributionForm">

<input type="text" name="memberId" placeholder="Enter Member ID" required><br><br>

<option value="Week 2">Week 2</option>
<option value="Week 3">Week 3</option>
<option value="Week 4">Week 4</option>
</select><br><br>

<input type="number" name="shares" placeholder="Enter Shares Amount">
<input type="number" name="savings" placeholder="Enter Savings Amount">

<button type="submit">Record Contribution</button>

</form>

<br><br>

<th>Shares</th>

</tr>

<tbody id="recordsTable"></tbody>
