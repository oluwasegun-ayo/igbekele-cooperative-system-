<form id="contributionForm">

<input type="text" name="memberId" placeholder="Enter Member ID">

<select name="week">
<option value="1">Week 1</option>
<option value="2">Week 2</option>
<option value="3">Week 3</option>
<option value="4">Week 4</option>
</select>

<input type="number" name="minutes" value="200">

<input type="number" name="shares" value="500">

<input type="number" name="savings" value="1000">

<button type="submit">Record Contribution</button>

</form>
<script>

let member = JSON.parse(localStorage.getItem("selectedMember"));
let contributions = JSON.parse(localStorage.getItem("contributions")) || [];

let minutes = 0;
let shares = 0;
let savings = 0;

contributions.forEach(c => {

if(c.memberId === member.id){

minutes += c.minutes;
shares += c.shares;
savings += c.savings;

}

});

document.getElementById("profile").innerHTML = `

<img src="${member.passport || ''}" width="100"><br><br>

<b>Member ID:</b> ${member.id}<br>
<b>Name:</b> ${member.name}<br>
<b>Phone:</b> ${member.phone}<br>
<b>NIN:</b> ${member.nin}<br>
<b>Age:</b> ${member.age}<br><br>

<h3>Financial Summary</h3>

Minutes Paid: ${minutes}<br>
Shares: ${shares}<br>
Savings: ${savings}<br>

`;

</script>
