<!DOCTYPE html>
<html>

<head>
<title>Weekly Contribution</title>
</head>

<body>

<h2>Weekly Contribution</h2>

<form id="contributionForm">

Member ID<br>
<input type="text" id="memberId" placeholder="Example: IGB001"><br><br>

Minutes<br>
<input type="number" id="minutes"><br><br>

Shares<br>
<input type="number" id="shares"><br><br>

Savings<br>
<input type="number" id="savings"><br><br>

<button type="submit">Record Contribution</button>

</form>

<script>

document.getElementById("contributionForm").addEventListener("submit", function(e){

e.preventDefault();

let contributions = JSON.parse(localStorage.getItem("contributions")) || [];

let record = {

memberId: document.getElementById("memberId").value,

minutes: Number(document.getElementById("minutes").value),

shares: Number(document.getElementById("shares").value),

savings: Number(document.getElementById("savings").value)

};

contributions.push(record);

localStorage.setItem("contributions", JSON.stringify(contributions));

alert("Contribution saved");

});

</script>

</body>
</html>
